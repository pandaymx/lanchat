name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build / vet / lint / race test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0

      - name: gofumpt
        run: |
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未通过 gofumpt："
            echo "$out"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: Race test with coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage gate (core/transfer/protocol >= 70%)
        run: |
          fail=0
          for pkg in internal/core internal/transfer internal/protocol; do
            pct=$(go tool cover -func=coverage.out \
              | awk -v p="^github.com/pandaymx/lanchat/$pkg/" '
                $1 ~ p { total++; sub(/%/, "", $3); sum += $3 }
                END { if (total > 0) printf "%.1f", sum/total }')
            echo "$pkg coverage: ${pct}%"
            if awk "BEGIN {exit !($pct < 70)}"; then
              echo "::error::$pkg 覆盖率 ${pct}% 低于 70% 门禁"
              fail=1
            fi
          done
          exit $fail

  # ui-android 在 PR 阶段从来没被编译过：gomobile 生成的 Java 名字只有 Get* 前缀的方法
  # 才会变成 Kotlin 属性语法可访问的 getter，browseServersJSON 这类漏括号的调用、
  # 缺 `import dev.lanchat.R` 这类错误，每次都要等 release 构建跑到
  # :app:compileReleaseKotlin 才暴露，还连带 publish 整个发版失败（v0.18~v0.23 全挂在这）。
  # 这里只编译不签名不打包，把发现点从发版提前到 PR。
  android-compile:
    name: Android compile (Kotlin + resources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 同 release.yml：cmdline-tools 新版已无废弃的 tools 包
          packages: 'cmdline-tools;latest'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        # API 37 的平台包带次版本号，不存在 platforms;android-37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_root }}

      - name: Add gomobile dependency
        run: go get golang.org/x/mobile@latest

      - name: Generate AAR
        run: |
          mkdir -p ui-android/app/libs
          gomobile bind -target=android -androidapi 26 -javapkg=dev.lanchat.bindings \
            -o ui-android/app/libs/mobile.aar ./bindings/mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_root }}

      - name: Compile release Kotlin
        working-directory: ui-android
        # compileReleaseKotlin 依赖 processReleaseResources，R 类与 strings.xml 键名
        # 是否对得上一并校验；release 变体而非 debug，才能编到本次挂掉的同一份代码。
        run: ./gradlew compileReleaseKotlin --no-daemon

  scope-boundary:
    name: scope boundary (per AGENTS.md §2)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths against branch ownership
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-scope.sh

  # ui-ios 的 Swift 只能在 macOS 上编译，而 Release 作业的 ios 构建只在带 v* tag
  # 的提交上跑（见 release.yml 的 resolve），导致 iOS 端代码合并前从未被编译过，
  # 只能等发版时由 Release 连续报错。这里补一道 PR 级编译门禁：
  # 仅当改动涉及 iOS 端 / gomobile 绑定时运行，只编译、不签名、不产出发布物。
  ios-changes:
    name: detect ui-ios changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          n="$(git diff --name-only "$BASE_SHA"...HEAD \
            | grep -cE '^(ui-ios/|bindings/mobile/|\.github/workflows/ci\.yml$|go\.(mod|sum)$)' || true)"
          if [ "${n:-0}" -gt 0 ]; then
            echo "本次 PR 涉及 iOS 端，启动 macos 编译门禁"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  ios-compile:
    name: iOS compile check (gomobile + Swift)
    needs: ios-changes
    if: needs.ios-changes.outputs.changed == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add gomobile dependency
        run: go get golang.org/x/mobile@latest

      - name: gomobile init
        run: gomobile init

      - name: Generate XCFramework
        run: |
          mkdir -p ui-ios/Frameworks
          gomobile bind -target=ios -iosversion=16.0 -prefix=LC \
            -o ui-ios/Frameworks/Mobile.xcframework ./bindings/mobile

      - name: Generate Xcode project
        working-directory: ui-ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ui-ios
        run: |
          # 与 Release 作业的 ios 构建参数保持一致：destination 已隐含架构，
          # Xcode 16 下不得再显式指定 -arch。
          xcodebuild -project LANChat.xcodeproj -scheme LANChat \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
