name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Go tools
        env:
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: sum.golang.google.cn
        run: |
          go install mvdan.cc/gofumpt@latest
          go install github.com/daixiang0/gci@latest
          go install github.com/a-h/templ/cmd/templ@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Install lefthook (prebuilt, 避免与 Go 1.27 不兼容)
        run: bun add -d @evilmartians/lefthook
      - name: Run lefthook pre-commit
        run: ./node_modules/.bin/lefthook run pre-commit
      - name: golangci-lint v2
        run: golangci-lint run

  test:
    name: test (race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Run tests with race
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.out

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Build all
        run: go build -o bin/ ./...
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: binaries
          path: bin/
