name: commit-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: webiny/action-conventional-commits@v1.3.0

  scope-enum:
    name: commit scope enum (AGENTS.md §5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate scopes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/check-commit-scope.sh
