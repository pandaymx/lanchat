name: Native UI gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Windows: dotnet build + xUnit test ───────────────────────────
  win:
    name: Windows (dotnet build + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui-win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LANChat.WinUI.sln

      - name: Build
        run: dotnet build LANChat.WinUI.sln --no-restore

      - name: Test
        run: dotnet test tests/LANChat.Ipc.Tests/LANChat.Ipc.Tests.csproj --verbosity normal

  # ─── Android: unit tests (JVM) ────────────────────────────────────
  # testDebugUnitTest 会编译 app 模块，而 app 依赖 gomobile 生成的 mobile.aar，
  # 所以必须先跑完 gomobile bind 才能编译通过。
  android-test:
    name: Android (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'cmdline-tools;latest'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_root }}

      - name: Add gomobile dependency
        run: go get golang.org/x/mobile@latest

      - name: Generate AAR
        run: |
          mkdir -p ui-android/app/libs
          gomobile bind -target=android -androidapi 26 -javapkg=dev.lanchat.bindings \
            -o ui-android/app/libs/mobile.aar ./bindings/mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_root }}

      - name: Run unit tests
        working-directory: ui-android
        run: ./gradlew testDebugUnitTest --no-daemon

  # ─── macOS: xcodegen + xcodebuild compile check ───────────────────
  macos:
    name: macOS (compile check)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ui-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no sign)
        run: |
          xcodebuild -project LANChat.xcodeproj -scheme LANChat \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
