name: Native UI gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Windows: dotnet build + xUnit test ───────────────────────────
  win:
    name: Windows (dotnet build + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui-win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore LANChat.WinUI.sln

      - name: Build
        run: dotnet build LANChat.WinUI.sln --no-restore

      - name: Test
        run: dotnet test tests/LANChat.Ipc.Tests/LANChat.Ipc.Tests.csproj --no-restore --verbosity normal

  # ─── Android: release Kotlin compile + unit tests (JVM) ───────────
  # 合并原 ci.yml 的 compileReleaseKotlin（校验 gomobile 绑定签名与 R 类资源）
  # 与 testDebugUnitTest，消除每次 PR/Push 双跑两套 NDK + gomobile bind 的开销。
  # CI 门禁仅需 AAR 内的 classes.jar 与单架构产物，故绑定单 ABI（android/arm64）
  # 并按 Go 源码哈希缓存 mobile.aar；Release 作业仍构建全 4 架构 AAR。
  android-test:
    name: Android (compile + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK platform 37.0
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] || [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            yes | "$SDKM" --licenses >/dev/null || true
            "$SDKM" "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Cache mobile.aar
        id: cache-aar
        uses: actions/cache@v4
        with:
          path: ui-android/app/libs/mobile.aar
          key: mobile-aar-arm64-16k-v0.0.0-20260908204917-8b95e45f8d3e-${{ hashFiles('go.mod', 'go.sum', 'bindings/mobile/**', 'internal/**') }}

      - name: Setup Go
        if: steps.cache-aar.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate AAR (arm64-v8a DWARF-stripped, 16KB page aligned)
        if: steps.cache-aar.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT="$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264"
            NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          fi
          export ANDROID_NDK_HOME="$NDK_ROOT"
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          go get golang.org/x/mobile@v0.0.0-20260908204917-8b95e45f8d3e
          mkdir -p ui-android/app/libs
          gomobile bind -target=android/arm64 -androidapi 26 -trimpath \
            -ldflags="-w -extldflags=-Wl,-z,max-page-size=16384" \
            -javapkg=dev.lanchat.bindings -o ui-android/app/libs/mobile.aar ./bindings/mobile

      - name: Compile release Kotlin & run unit tests
        working-directory: ui-android
        run: ./gradlew compileReleaseKotlin testDebugUnitTest --no-daemon

  # ─── macOS: xcodegen + xcodebuild compile check ───────────────────
  macos:
    name: macOS (compile check)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ui-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (no sign)
        run: |
          xcodebuild -project LANChat.xcodeproj -scheme LANChat \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO build
