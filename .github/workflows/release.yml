name: Release

on:
  # 主触发链（2026-09-07 起全自动）：
  #   push main（含 feat/fix 语义化 commit）→ semantic-release 算版本号 →
  #   CHANGELOG commit（[skip ci]，不触发新 run）→ 打 tag（GITHUB_TOKEN
  #   push 不触发新 run）→ 创建 GitHub Release → 同 run 内 package job
  #   交叉编译打包上传。无循环：GITHUB_TOKEN 产生的事件不触发 workflow。
  push:
    branches: [main]
    # 兜底：本地/手动 publish 产生的 tag push 复跑一次（幂等），确保
    # Release 页与打包资产最终一致（@semantic-release/github failOnError
    # 为 false，无新 release 时幂等跳过）。
    tags:
      - 'v*'
  # 手动：用于复跑验证 / 临时 dry-run。默认 dryRun=true。
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run only (no publish)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.det.outputs.released }}
      version: ${{ steps.det.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # 完整历史：semantic-release 分析 commits 需要；
          # 打包版本号也依赖 tag 前后对比（package job 同样 fetch-depth 0）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # .releaserc.json 的 repositoryUrl 是 HTTPS（2026-09-07 起），runner
      # 无 SSH key。insteadOf 全局改写：git 对任何 https://github.com/ 访问
      # （semantic-release 按 repositoryUrl push、@semantic-release/git 的
      # commit+tag push）自动带 GITHUB_TOKEN，GITHUB_TOKEN 有 contents: write。
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release 执行前的最新 tag（Detect new release 的基线）
      - name: Snapshot latest tag
        id: snap
        run: |
          before=$(git tag --list 'v*' | sort -V | tail -1 || true)
          echo "before=$before" >> "$GITHUB_OUTPUT"
      # workflow_dispatch + dryRun=true → 仅分析，不发布
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: bunx semantic-release --dry-run
      # 其它路径（push main / push tag / workflow_dispatch dryRun=false）→ 真实 publish
      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dryRun }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      # 本次 run 是否真的发布了版本（git tag 前后对比）：
      #  - push tag：强制视为已发布（兜底复跑），版本取 ref_name；
      #  - 其余：semantic-release 创建了新 tag → released=true；
      #  - dryRun / no new release → released=false，package job 跳过。
      # 不能从 HEAD 用 git describe 拿版本：HEAD 停在 push 的 commit，
      # 新 tag 指向 semantic-release 的 chore commit（HEAD 的子提交），
      # describe 只会回溯到旧 tag（2026-09-07 实测拿到 v0.5.0）。
      - name: Detect new release
        id: det
        run: |
          before="${{ steps.snap.outputs.before }}"
          after=$(git tag --list 'v*' | sort -V | tail -1 || true)
          if [ "${{ github.event_name == 'push' && github.ref_type == 'tag' }}" = "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # M10（2026-09-07）：桌面端（Wails v3 窗口壳，ADR-015）。CGO 唯一例外：
  # 必须原生 runner（Linux webkitgtk-6.0 / Windows WebView2+mingw / macOS
  # WKWebView），与 package job 的 CGO_ENABLED=0 纯 Go 矩阵分开。产物
  # lanchat-desktop-<ver>-<os>-<arch> 压缩包 + sha256，上传到同一 Release。
  desktop:
    name: desktop (${{ matrix.runner }})
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) && needs.release.outputs.released == 'true' }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      LANCHAT_VERSION: ${{ needs.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          # Windows on ARM：GitHub 无 windows-arm64 公共 runner，用
          # ubuntu-latest + gcc-mingw-w64-aarch64 交叉编译（Wails v3
          # CGO 链同 package job 的 Linux nsis 打包路径，2026-09-08 补）。
          - runner: ubuntu-latest
            goos: windows
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          # macos-13（Intel）公共 runner 2026-09 供给极差（曾排队 9h+ 拖死
          # 整个 release）。Intel dmg 暂时移除，待 macos-14/15 有 amd64
          # runner 或自建 runner 后恢复（pkg-macos-dmg.sh 已支持 arch）。
          # - runner: macos-13
          #   goos: darwin
          #   goarch: amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      # Wails v3 系统依赖：Linux 需要 gtk4 + webkitgtk-6.0（pkg-config 还查
      # libsoup-3.0 / gio-unix）；Windows 需要 mingw gcc（WebView2 runtime
      # 预装）；macOS xcode CLT 预装无需动作。
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && matrix.goarch != 'arm64'
        # rpm 供 rpmbuild 产 .rpm；arm64 runner（ubuntu-24.04-arm）原生 apt 装 arm64 依赖
        run: sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo apt-get update || true && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libglib2.0-dev rpm
      - name: Install Linux arm64 dependencies
        if: runner.os == 'Linux' && matrix.goarch == 'arm64' && matrix.goos != 'windows'
        run: sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo apt-get update || true && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev libglib2.0-dev rpm
      # Windows ARM64 交叉编译（ubuntu-latest）：Ubuntu noble 无
      # gcc-mingw-w64-aarch64 包（2026-09-08 apt 实测 E: Unable to locate），
      # 改用 mstorsjo/llvm-mingw 预编译工具链（aarch64 目标，clang 作 CC，
      # Go cgo 支持 clang）。nsis 供 Linux 打 windows setup.exe。
      - name: Install Windows arm64 cross toolchain
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        run: |
          sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo apt-get update || true && sudo apt-get install -y nsis
          curl -sL https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-ubuntu-20.04-x86_64.tar.xz -o /tmp/llvm-mingw.tar.xz
          sudo tar -C /opt -xf /tmp/llvm-mingw.tar.xz
          ls /opt/llvm-mingw*/bin/aarch64-w64-mingw32-clang
      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        run: choco install mingw nsis -y
      # *_templ.go 被 .gitignore 排除，desktop 依赖 internal/webui 模板，
      # 构建前必须 templ generate（与 package job 同款 pin）。
      - name: Install templ CLI
        env:
          # sum.golang.google.cn 在美国 runner 上不稳定（两次 INSTALL
          # 因 tile 校验 INTERNAL_ERROR 失败）；github-hosted runner 走
          # sum.golang.org + proxy.golang.org 才是官方稳定通道。
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Generate templ files
        run: templ generate
      - name: Detect arch
        id: arch
        shell: bash
        run: echo "arch=$(go env GOARCH)" >> "$GITHUB_OUTPUT"
      - name: Build desktop
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist/raw
          # go build -o 指定完整路径时不自动加 .exe（windows 产物无扩展名），
          # 显式带上，后续 Package/Upload 按 .exe 名找。
          out=dist/raw/lanchat-desktop
          if [ "${{ matrix.goos }}" = "windows" ]; then out="$out.exe"; fi
          # windows/arm64 交叉组合：CC 指向 llvm-mingw 的 aarch64 clang
          if [ "${{ matrix.goos }}" = "windows" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC="$(ls /opt/llvm-mingw*/bin/aarch64-w64-mingw32-clang | head -1)"
            echo "CC=$CC"
          fi
          go build -tags desktop -ldflags "-s -w -X main.version=$LANCHAT_VERSION -X main.commit=$COMMIT -X main.date=$DATE" -o "$out" ./apps/desktop
          # 诊断：确认产物名与路径（2026-09-08 NSIS no files found 排查）
          ls -la dist/raw/ || echo "dist/raw MISSING"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # M11.1（2026-09-07）：桌面端安装包矩阵扩到 5 平台组合——
          #   windows: NSIS 向导安装器（amd64，arm64 见 package job）
          #   darwin : .dmg（arm64 = macos-latest 原生 / amd64 = macos-13 原生）
          #   linux  : .deb + .rpm（amd64 = ubuntu-24.04 / arm64 = ubuntu-24.04-arm）
          # 打包逻辑收敛到 .github/installer/ 通用脚本（desktop + CLI 复用）。
          arch=${{ matrix.goarch }}
          case "${{ matrix.goos }}" in
            windows)
              # choco 装的 NSIS 不进当前 step 的 PATH（PATH 在 runner 启动时
              # 固化，choco 的 PATH 修改对后续 step 不生效），Windows runner
              # 显式全路径；Linux runner（woa 交叉组合）直接用 PATH 里
              # 的 makensis（apt 装的 nsis）。
              if [ "${{ runner.os }}" = "Windows" ]; then
                export MAKENSIS="/c/Program Files (x86)/NSIS/makensis.exe"
              fi
              ./.github/installer/pkg-windows-nsis.sh "${LANCHAT_VERSION#v}" "$arch" desktop
              ;;
            darwin)
              bash .github/installer/pkg-macos-dmg.sh "${LANCHAT_VERSION#v}" "$arch"
              ;;
            linux)
              ./.github/installer/pkg-linux-deb.sh "${LANCHAT_VERSION#v}" "$arch" desktop
              ./.github/installer/pkg-linux-rpm.sh "${LANCHAT_VERSION#v}" "$arch" desktop
              ;;
          esac
      - name: Upload release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$LANCHAT_VERSION"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --notes "> 由 CI 打包 job 补建的 Release 页面。"
          shopt -s nullglob
          gh release upload "$tag" dist/*.exe dist/*.dmg dist/*.deb dist/*.rpm --clobber

  # 哈希汇总（2026-09-07）：逐文件 .sha256 太多（每资产一个），改为
  # 全部资产一个 checksums.txt。package / desktop 各 job 不再产 .sha256，
  # 本 job 等两批上传完成后下载全量资产、聚合写入一个文件再上传。
  # Flutter 移动端（2026-09-10）：Android APK。
  # lanchat_mobile 直连 hub 的 WS 协议（wire v1）；subosito/flutter-action
  # 装稳定版 Flutter + Android SDK（ubuntu-latest），缓存 pub/gradle。
  # 产物 lanchat-mobile-<ver>-android.apk 上传同 Release（checksums 的
  # lanchat-* 通配自动覆盖）。iOS 构建需签名与 Apple 账号，留后续迭代。
  mobile:
    name: mobile (android)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) && needs.release.outputs.released == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LANCHAT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Set up Android release signing
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # 稳定签名：keystore 以 base64 存在 GitHub Secrets，每个版本同一把
          # 签名 → 用户可覆盖安装升级（之前用 runner 临时 debug keystore，
          # 每次签名都不同，新包无法覆盖旧包）。
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/lanchat-release.jks
          cat > android/key.properties <<'EOF'
          storeFile=app/lanchat-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          test -s android/app/lanchat-release.jks
      - name: Build APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter pub get
          # versionCode 由语义版本号生成（2.1.3 -> 20103），随版本单调递增，
          # 替代固定 1（否则安装器可能因 versionCode 未增而拒绝升级）。
          ver_num=$(echo "${LANCHAT_VERSION#v}" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')
          flutter build apk --release --build-name="${LANCHAT_VERSION#v}" --build-number="$ver_num"
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="$LANCHAT_VERSION"
          tag="$ver"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --notes "> 由 CI mobile job 补建的 Release 页面。"
          mkdir -p dist
          cp "apps/mobile/build/app/outputs/flutter-apk/app-release.apk" "dist/lanchat-mobile-$ver-android.apk"
          gh release upload "$tag" "dist/lanchat-mobile-$ver-android.apk" --clobber

  # Flutter iOS（2026-09-13）：macOS runner 出未签名 ipa。
  # iOS 构建/签名必须在 macOS + Xcode 上做；项目暂无 Apple Developer
  # 证书 secrets，用 --no-codesign 产出未签名 ipa（用户自行签名安装，
  # 见 README「iOS 安装」）。有证书后加 secrets 并去掉 --no-codesign。
  ios:
    name: mobile (ios)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) && needs.release.outputs.released == 'true' }}
    needs: release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      LANCHAT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install pods
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          flutter pub get
          cd ios
          pod install
      - name: Build iOS app + package unsigned ipa
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          # flutter build ipa --no-codesign 会跳过 IPA 生成（只 archive）；
          # 改用 build ios --no-codesign 产出 .app 后按 Payload 结构打包，
          # 得到未签名 ipa（用户用 Xcode / Sideloadly 自行签名安装）。
          flutter build ios --release --no-codesign --build-name="${LANCHAT_VERSION#v}" --build-number=1
          mkdir -p build/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "lanchat-mobile-${LANCHAT_VERSION#v}-ios-unsigned.ipa" Payload/
      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="$LANCHAT_VERSION"
          tag="$ver"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --notes "> 由 CI ios job 补建的 Release 页面。"
          gh release upload "$tag" "apps/mobile/build/ipa/lanchat-mobile-${ver#v}-ios-unsigned.ipa" --clobber

  checksums:
    name: checksums
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) && needs.release.outputs.released == 'true' }}
    needs: [release, package, desktop, mobile, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LANCHAT_VERSION: ${{ needs.release.outputs.version }}
    steps:
      # gh 在无 .git 的目录跑 release download 会报
      # "failed to run git: not a git repository"（2026-09-08 v1.0.0
      # checksums job 实测），先 checkout 拿到 repo 上下文。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist && cd dist
          gh release download "$LANCHAT_VERSION" --pattern 'lanchat-*' --clobber
          ls -1
      - name: Write aggregated checksums.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum lanchat-* > checksums.txt
          cat checksums.txt
      - name: Upload checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$LANCHAT_VERSION" dist/checksums.txt --clobber

  # M8 收尾（2026-09-07）：给 Release 页附上可下载的二进制。
  # 之前 ci.yml 的 build job 只传 Actions artifact（30 天过期、不对外），
  # Release 页只有 changelog notes；此处补上原生二进制矩阵。
  package:
    name: package (${{ matrix.goos }}-${{ matrix.goarch }})
    # 只有 release job 确认本次发出了新版本才打包（main push 自动发版 /
    # tag push 兜底复跑）；dryRun 与 no new release 都跳过。版本号直接
    # 用 release job 算出的实际版本（git describe 拿不到，见 Detect step）。
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) && needs.release.outputs.released == 'true' }}
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      LANCHAT_VERSION: ${{ needs.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux-arm64 走原生 arm64 runner（ubuntu-24.04-arm）：deb 可用
          # dpkg-deb 交叉打，但 rpmbuild 在 x86_64 host 上 --target aarch64
          # 报 "No compatible architectures found for build"（缺 aarch64
          # 平台文件）；原生 runner 零交叉问题（2026-09-08 实测 desktop
          # ubuntu-24.04-arm 的 deb/rpm 均成功）。其余矩阵维持 ubuntu-latest
          # 纯 Go 交叉编译（CGO=0）+ Linux nsis/dpkg 打安装包。
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: ubuntu-latest
          - goos: darwin
            goarch: arm64
            runner: ubuntu-latest
          - goos: windows
            goarch: amd64
            ext: .exe
            runner: ubuntu-latest
          - goos: windows
            goarch: arm64
            ext: .exe
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      # *_templ.go 被 .gitignore 排除（构建产物不入库），交叉编译前必须
      # 先 templ generate，否则 internal/webui/templates 缺文件编译失败。
      # 版本与 go.mod / ci.yml / check.sh 的 pin 保持一致（0.3.1020）。
      - name: Install templ CLI
        env:
          # sum.golang.google.cn 在美国 runner 上不稳定（两次 INSTALL
          # 因 tile 校验 INTERNAL_ERROR 失败）；github-hosted runner 走
          # sum.golang.org + proxy.golang.org 才是官方稳定通道。
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Generate templ files
        run: templ generate
      # M11.1：安装包需要 rpmbuild / makensis（linux runner 上交叉打
      # windows NSIS + linux deb/rpm；darwin 只产压缩包不需要）。
      - name: Install packaging tools
        if: matrix.goos != 'darwin'
        run: sudo sed -i '/dl\.google\.com/d' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true; sudo apt-get update || true && sudo apt-get install -y rpm nsis
      # 纯 Go + 零 CGO（AGENTS.md §2）：CGO_ENABLED=0 交叉编译无坑。
      # 版本注入与 Makefile LDFLAGS 同款（main.version/commit/date），
      # 值取自 git（describe / rev-parse），与触发方式无关。
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist/raw/${{ matrix.goos }}-${{ matrix.goarch }}
          go build -ldflags "-s -w -X main.version=$LANCHAT_VERSION -X main.commit=$COMMIT -X main.date=$DATE" \
            -o dist/raw/${{ matrix.goos }}-${{ matrix.goarch }}/ ./cmd/...
      # M9 收尾（2026-09-07）：hub/tui/web 拆成各自独立的压缩包（仍为
      # 压缩包非安装包）。产物命名 lanchat-<bin>-<ver>-<os>-<arch>，每
      # 个二进制一个压缩包 + 一个 .sha256；Windows 端同样三份 .zip。
      # 好处：下载端只拿自己需要的二进制（LAN 聊天场景 hub 端常驻服务器、
      # 客户端按平台取 tui/web 单独包），Release 页 18 个压缩资产一一对应。
      - name: Package
        run: |
          set -euo pipefail
          raw=dist/raw/${{ matrix.goos }}-${{ matrix.goarch }}
          ver="$LANCHAT_VERSION"
          osarch="${{ matrix.goos }}-${{ matrix.goarch }}"
          ext=""
          [ "${{ matrix.goos }}" = "windows" ] && ext=".exe"
          ROOT="$PWD"
          cd "$raw"
          for bin in hub tui web; do
            name="lanchat-${bin}-${ver}-${osarch}"
            if [ -n "$ext" ]; then
              zip -q -r "../../${name}.zip" "${bin}${ext}"
            else
              tar -czf "../../${name}.tar.gz" "${bin}"
            fi
          done
          # M11.1：压缩包之外，每个 CLI 二进制再产安装包——
          #   linux: deb + rpm（amd64/arm64）
          #   windows: NSIS 安装器（amd64/arm64，含 WOA）
          # 注意：dist/raw/<goos>-<goarch> 向上两级只到 dist，必须用
          # 绝对路径回仓库根（此前 cd ../.. 导致后续相对路径全部错位）。
          cd "$ROOT"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            for bin in hub tui web; do
              cp "$raw/${bin}${ext}" "dist/raw/${bin}${ext}"
              ./.github/installer/pkg-windows-nsis.sh "${ver#v}" "${{ matrix.goarch }}" "$bin"
            done
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            for bin in hub tui web; do
              cp "$raw/${bin}" "dist/raw/${bin}"
              ./.github/installer/pkg-linux-deb.sh "${ver#v}" "${{ matrix.goarch }}" "$bin" cli
              ./.github/installer/pkg-linux-rpm.sh "${ver#v}" "${{ matrix.goarch }}" "$bin" cli
            done
          fi
      # gh 上传幂等：--clobber 覆盖同名 asset（复跑不报错）；Release 页面
      # 若意外缺失则 create 兜底（permissions.contents: write 已够）。
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$LANCHAT_VERSION"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --notes "> 由 CI 打包 job 补建的 Release 页面。"
          # dist/* 会匹配到 dist/raw 目录（gh 上传目录报错）；nullglob
          # 精确匹配三类产物，缺一类时展开为空不报错（linux/darwin 只有
          # tar.gz、windows 只有 zip）
          shopt -s nullglob
          gh release upload "$tag" dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*.exe --clobber