name: Release

on:
  # 自动：tag push 时跑 publish，兜底确保 GitHub Release 页面创建成功。
  # 配合 .releaserc.json 里的 @semantic-release/github，本地先 publish
  # 一次，Actions 复跑时若无新 release 会自动跳过（idempotent）。
  push:
    tags:
      - 'v*'
  # 手动：用于复跑验证 / 临时 dry-run。默认 dryRun=true。
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run only (no publish)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 走 SSH 推到 .releaserc.json 的 repositoryUrl；Actions runner 没有 SSH key 时
          # 这个 workflow 反正只用 secrets.GITHUB_TOKEN 做 GitHub API 调用，不调 git push。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # workflow_dispatch + dryRun=true → 仅分析，不发布
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: bunx semantic-release --dry-run
      # 其它路径（push tag 或 workflow_dispatch dryRun=false）→ 真实 publish
      - name: Publish
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dryRun) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
