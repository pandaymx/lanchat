name: Release

on:
  # 主触发链（2026-09-07 起全自动）：
  #   push main（含 feat/fix 语义化 commit）→ semantic-release 算版本号 →
  #   CHANGELOG commit（[skip ci]，不触发新 run）→ 打 tag（GITHUB_TOKEN
  #   push 不触发新 run）→ 创建 GitHub Release → 同 run 内 package job
  #   交叉编译打包上传。无循环：GITHUB_TOKEN 产生的事件不触发 workflow。
  push:
    branches: [main]
    # 兜底：本地/手动 publish 产生的 tag push 复跑一次（幂等），确保
    # Release 页与打包资产最终一致（@semantic-release/github failOnError
    # 为 false，无新 release 时幂等跳过）。
    tags:
      - 'v*'
  # 手动：用于复跑验证 / 临时 dry-run。默认 dryRun=true。
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run only (no publish)'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.det.outputs.released }}
      version: ${{ steps.det.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # 完整历史：semantic-release 分析 commits 需要；
          # 打包版本号也依赖 tag 前后对比（package job 同样 fetch-depth 0）。
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # .releaserc.json 的 repositoryUrl 是 HTTPS（2026-09-07 起），runner
      # 无 SSH key。insteadOf 全局改写：git 对任何 https://github.com/ 访问
      # （semantic-release 按 repositoryUrl push、@semantic-release/git 的
      # commit+tag push）自动带 GITHUB_TOKEN，GITHUB_TOKEN 有 contents: write。
      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # semantic-release 执行前的最新 tag（Detect new release 的基线）
      - name: Snapshot latest tag
        id: snap
        run: |
          before=$(git tag --list 'v*' | sort -V | tail -1 || true)
          echo "before=$before" >> "$GITHUB_OUTPUT"
      # workflow_dispatch + dryRun=true → 仅分析，不发布
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: bunx semantic-release --dry-run
      # 其它路径（push main / push tag / workflow_dispatch dryRun=false）→ 真实 publish
      - name: Publish
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dryRun }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      # 本次 run 是否真的发布了版本（git tag 前后对比）：
      #  - push tag：强制视为已发布（兜底复跑），版本取 ref_name；
      #  - 其余：semantic-release 创建了新 tag → released=true；
      #  - dryRun / no new release → released=false，package job 跳过。
      # 不能从 HEAD 用 git describe 拿版本：HEAD 停在 push 的 commit，
      # 新 tag 指向 semantic-release 的 chore commit（HEAD 的子提交），
      # describe 只会回溯到旧 tag（2026-09-07 实测拿到 v0.5.0）。
      - name: Detect new release
        id: det
        run: |
          before="${{ steps.snap.outputs.before }}"
          after=$(git tag --list 'v*' | sort -V | tail -1 || true)
          if [ "${{ github.event_name == 'push' && github.ref_type == 'tag' }}" = "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # M8 收尾（2026-09-07）：给 Release 页附上可下载的二进制。
  # 之前 ci.yml 的 build job 只传 Actions artifact（30 天过期、不对外），
  # Release 页只有 changelog notes；此处补上原生二进制矩阵。
  package:
    name: package (${{ matrix.goos }}-${{ matrix.goarch }})
    # 只有 release job 确认本次发出了新版本才打包（main push 自动发版 /
    # tag push 兜底复跑）；dryRun 与 no new release 都跳过。版本号直接
    # 用 release job 算出的实际版本（git describe 拿不到，见 Detect step）。
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) && needs.release.outputs.released == 'true' }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANCHAT_VERSION: ${{ needs.release.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false
      # *_templ.go 被 .gitignore 排除（构建产物不入库），交叉编译前必须
      # 先 templ generate，否则 internal/webui/templates 缺文件编译失败。
      # 版本与 go.mod / ci.yml / check.sh 的 pin 保持一致（0.3.1020）。
      - name: Install templ CLI
        env:
          GOPROXY: https://goproxy.cn,direct
          GOSUMDB: sum.golang.google.cn
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020
      - name: Generate templ files
        run: templ generate
      # 纯 Go + 零 CGO（AGENTS.md §2）：CGO_ENABLED=0 交叉编译无坑。
      # 版本注入与 Makefile LDFLAGS 同款（main.version/commit/date），
      # 值取自 git（describe / rev-parse），与触发方式无关。
      - name: Cross-compile
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p dist/raw/${{ matrix.goos }}-${{ matrix.goarch }}
          go build -ldflags "-s -w -X main.version=$LANCHAT_VERSION -X main.commit=$COMMIT -X main.date=$DATE" \
            -o dist/raw/${{ matrix.goos }}-${{ matrix.goarch }}/ ./cmd/...
      - name: Package
        run: |
          set -euo pipefail
          name=lanchat-$LANCHAT_VERSION-${{ matrix.goos }}-${{ matrix.goarch }}
          cd dist/raw/${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q -r ../../$name.zip hub${{ matrix.ext }} tui${{ matrix.ext }} web${{ matrix.ext }}
          else
            tar -czf ../../$name.tar.gz hub tui web
          fi
          cd ../..
          sha256sum $name.* > $name.sha256
      # gh 上传幂等：--clobber 覆盖同名 asset（复跑不报错）；Release 页面
      # 若意外缺失则 create 兜底（permissions.contents: write 已够）。
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$LANCHAT_VERSION"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --notes "> 由 CI 打包 job 补建的 Release 页面。"
          # dist/* 全量上传（linux/darwin 只有 tar.gz、windows 只有 zip，
          # 按扩展名 glob 会在缺失一侧直接 nomatch 退出）
          gh release upload "$tag" dist/* --clobber