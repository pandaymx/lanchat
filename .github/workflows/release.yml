name: Release

# 触发方式：
# 1. workflow_run：release-please 工作流成功后触发（release-please 用 GITHUB_TOKEN 打 tag，
#    该 tag 不会触发 push 事件工作流，故必须监听 workflow_run）
# 2. push tags：人类手动 push 的 tag
# 3. workflow_dispatch：回填历史版本（如 v0.16.0）
on:
  workflow_run:
    workflows: ['release-please']
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.16.0），构建基于当前工作流所在 ref'
        required: true
        default: 'v0.16.0'

permissions:
  contents: write

# gomobile 版本集中在此，不再用 @latest。
# x/mobile 没有打 tag，@latest 每次解析到当期 pseudo-version，上游一合入
# 同一个 tag 就会在不同时间构建出不同的 AAR/XCFramework —— 既不可复现，
# 也让「发版失败」可能是上游变更而非本仓库改动引起。
env:
  GOMOBILE_VERSION: v0.0.0-20260908204917-8b95e45f8d3e

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      ref: ${{ steps.r.outputs.ref }}
      do_build: ${{ steps.r.outputs.do_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve
        id: r
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          do_build=false; tag=""; ref=""
          case "$EVENT_NAME" in
            push)
              tag="${EVENT_REF#refs/tags/}"
              ref="$tag"
              do_build=true
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              ref="$GITHUB_SHA"
              git ls-remote --tags origin "refs/tags/$tag" | grep -q . \
                || { echo "::error::tag $tag 不存在"; exit 1; }
              do_build=true
              ;;
            workflow_run)
              # 仅当 workflow_run 指向的提交恰好带 v* tag 时才构建
              tags="$(git ls-remote --tags origin | awk -v s="$HEAD_SHA" '$1==s{print $2}' | sed 's#refs/tags/##; s#\^{}##')"
              tag="$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
              if [ -n "$tag" ]; then
                ref="$HEAD_SHA"
                do_build=true
                echo "release-please 提交 $HEAD_SHA 带 tag $tag，开始构建"
              else
                echo "该提交无发布 tag，跳过（普通 release-please PR 合并）"
              fi
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "do_build=$do_build" >> "$GITHUB_OUTPUT"

  daemon:
    name: Build daemon (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          ext=""
          [ "$GOOS" = windows ] && ext=".exe"
          mkdir -p dist
          base="lanchat-daemon-${TAG}-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X main.commit=${GITHUB_SHA::7}" \
            -o "dist/${base}${ext}" ./cmd/lanchat-daemon
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  linux:
    name: Build Linux package (GTK4, x64)
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    # GTK4 / libadwaita 直接取系统包，见下方 Install GTK4 / libadwaita 的说明。
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui-linux

      # gtk4-rs 0.9 需要 GTK >= 4.16，libadwaita-rs 0.7 需要 >= 1.5 且用到 v1_6。
      # 原先从 conda-forge 取库，是因为 ubuntu-latest（24.04）的系统版本不够；
      # rust-ci.yml 已在 ubuntu-26.04 上用系统包跑通 cargo clippy --all-targets
      # （会真正执行 gtk4/adw 的 build script 做版本校验），故此处改用 apt，
      # 省下 setup-miniconda 每次 62–67s 的环境求解与下载。
      - name: Install GTK4 / libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev

      - name: Build lanchat-ui
        working-directory: ui-linux
        run: cargo build --release

      - name: Build lanchat-daemon
        run: |
          mkdir -p dist/stage
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.commit=${GITHUB_SHA::7}" \
            -o dist/stage/lanchat-daemon ./cmd/lanchat-daemon

      - name: Assemble tarball
        shell: bash
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p dist/stage
          cp ui-linux/target/release/lanchat-ui dist/stage/
          chmod +x dist/stage/lanchat-ui dist/stage/lanchat-daemon
          tar -C dist/stage -czf "dist/LANChat-${TAG#v}-linux-x64.tar.gz" .
          ls -lh dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/LANChat-*-linux-x64.tar.gz
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle 缓存：与 ci.yml 的 android-compile 用完全相同的写法（不额外指定
          # cache-dependency-path），两个工作流因此落在同一个 cache key 上 ——
          # Release 构建能直接命中刚才 PR 跑出来的 Gradle 分发 + 依赖缓存。
          # 收益实证：ci.yml 的 android-compile 全程 158s（日志 Cache restored from key: gradle-…），
          # 而本作业未开缓存时 Build release APK 单步 196s。
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          # 禁用对已废弃的 SDK 'tools' 包的默认安装（新版 cmdline-tools 已无此包）
          packages: 'cmdline-tools;latest'

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        # API 37 的平台包带次版本号（android-37.0/37.1/37.2），
        # 不存在 platforms;android-37 这个包，sdkmanager 会报 Failed to find package
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        run: gomobile init
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_root }}

      - name: Add gomobile dependency
        run: go get golang.org/x/mobile@${{ env.GOMOBILE_VERSION }}

      - name: Generate AAR
        run: |
          mkdir -p ui-android/app/libs
          gomobile bind -target=android -androidapi 26 -javapkg=dev.lanchat.bindings \
            -o ui-android/app/libs/mobile.aar ./bindings/mobile
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_root }}

      # 签名凭据预检：把「能不能签」这件事在打包前问清楚，并给出可执行的结论。
      # 历史故障：keystore 能被 storepass 打开，但 ANDROID_KEY_PASSWORD 恢复不出私钥，
      # AGP 直到 :app:packageRelease 才抛出 KeytoolException「Cannot recover key」，
      # 白烧 4 分钟构建且连带 publish 整个 release 失败。
      # 常见成因是 keytool 生成的库实为 PKCS12（JDK9+ 默认），其 keypass 恒等于 storepass。
      - name: Validate signing credentials
        id: sign
        env:
          KS_PATH: ${{ github.workspace }}/.signing/lanchat.jks
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 不用 -e：所有失败路径都由本步骤显式判定并降级，避免半路中断导致
          # $GITHUB_OUTPUT 里没有 ready，后续 if 判断失真。
          set -uo pipefail

          # 约定：任何输出只允许出现 secret 的「名字」，绝不回显其值。
          out() {
            echo "ready=$1" >> "$GITHUB_OUTPUT"
            if [ -n "${2:-}" ]; then echo "key_pass_source=$2" >> "$GITHUB_OUTPUT"; fi
          }
          abort() {
            echo "::warning::Android 签名不可用：$1"
            {
              echo "### Android 签名降级为 debug APK"
              echo ""
              echo "- 原因：$1"
              echo "- 修复：核对仓库 secrets \`ANDROID_KEYSTORE_B64\` / \`ANDROID_KEYSTORE_PASSWORD\` /"
              echo "  \`ANDROID_KEY_ALIAS\` / \`ANDROID_KEY_PASSWORD\`；若库为 PKCS12，则"
              echo "  \`ANDROID_KEY_PASSWORD\` 必须与 \`ANDROID_KEYSTORE_PASSWORD\` 相同。"
            } >> "$GITHUB_STEP_SUMMARY"
            out false ""
            exit 0
          }

          # 1) 未配置任何签名 secret 属预期状态（AGENTS.md §9），只提示不告警。
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::notice::未配置 ANDROID_KEYSTORE_B64，按 debug APK 发布（AGENTS.md §9 无签名制品）"
            out false ""
            exit 0
          fi

          # 2) 配置了一半更容易误诊：空口令会探出与真实原因无关的失败。
          missing=""
          [ -n "${KS_PASS:-}" ]   || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "${KEY_ALIAS:-}" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "${KEY_PASS:-}" ]  || missing="$missing ANDROID_KEY_PASSWORD"
          [ -z "$missing" ] || abort "已配置 ANDROID_KEYSTORE_B64 但缺少 secret：${missing# }"

          # 3) 解码并校验长度，捕获 secret 换行/截断导致的「伪 keystore」。
          mkdir -p "$(dirname "$KS_PATH")"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS_PATH" \
            || abort "ANDROID_KEYSTORE_B64 解码失败（非法 base64）"
          size=$(wc -c < "$KS_PATH" | tr -d ' ')
          [ "$size" -gt 256 ] || abort "解码后 keystore 仅 ${size} 字节，疑似 secret 被截断"
          # 魔数仅用于报告：JKS 为 0xFEEDFEED，PKCS12 是 DER SEQUENCE（0x30 开头）。
          case "$(od -An -tx1 -N4 "$KS_PATH" | tr -d ' \n')" in
            feedfeed) echo "keystore：${size} 字节，格式 JKS" ;;
            30*)      echo "keystore：${size} 字节，格式 PKCS12（该格式 keypass 恒等于 storepass）" ;;
            *)        echo "keystore：${size} 字节，格式待探针判定" ;;
          esac

          # 4) 探针动作与 AGP 打包时完全一致：KeyStore.getKey(alias, keyPassword)。
          #    不用 keytool -importkeystore —— 它会把 PKCS12 的 srckeypass 归一成 storepass，
          #    恰好探不出「keypass 不匹配」这个真实故障点。
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          cat > "$WORK/KeyProbe.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.io.InputStream;
          import java.security.KeyStore;
          import java.security.UnrecoverableKeyException;

          public final class KeyProbe {
              public static void main(String[] args) throws Exception {
                  if (args.length < 2) { System.out.println("BADARGS"); return; }
                  KeyStore ks = load(args[0], pass("KS_PASS"));
                  if (ks == null) { System.out.println("UNOPENABLE"); return; }
                  if (!ks.containsAlias(args[1])) { System.out.println("NOALIAS"); return; }
                  try {
                      System.out.println(ks.getKey(args[1], pass("PROBE_PASS")) != null ? "OK" : "UNRECOVERABLE");
                  } catch (UnrecoverableKeyException wrongKeyPass) {
                      System.out.println("UNRECOVERABLE");
                  }
              }

              // PKCS12 与 JKS 都试一遍，AGP 也不要求调用方指定 storetype。
              private static KeyStore load(String file, char[] storePass) {
                  for (String type : new String[] {"PKCS12", "JKS"}) {
                      try (InputStream in = new FileInputStream(file)) {
                          KeyStore ks = KeyStore.getInstance(type);
                          ks.load(in, storePass);
                          return ks;
                      } catch (Exception notThisType) {
                          // 换下一种 storetype 再试
                      }
                  }
                  return null;
              }

              private static char[] pass(String envName) {
                  String value = System.getenv(envName);
                  return value == null ? new char[0] : value.toCharArray();
              }
          }
          JAVA

          probe() { # $1=候选私钥口令 → 打印状态词，任何情况下都不回显口令
            local result rc
            result=$(PROBE_PASS="$1" java "$WORK/KeyProbe.java" "$KS_PATH" "$KEY_ALIAS" 2>/dev/null | tail -1)
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "PROBE_ERROR"
            else
              echo "${result//[^A-Z_]/}"
            fi
          }

          # 5) 先用配置的 ANDROID_KEY_PASSWORD，失败再用 ANDROID_KEYSTORE_PASSWORD，
          #    两者都不行才降级；每条分支都指到具体 secret，便于人工修复。
          first=$(probe "$KEY_PASS")
          if [ "$first" = OK ]; then
            echo "签名凭据校验通过：私钥由 ANDROID_KEY_PASSWORD 恢复"
            out true ANDROID_KEY_PASSWORD
            exit 0
          fi

          second=$(probe "$KS_PASS")
          case "$second" in
            OK)
              # 自愈：PKCS12 库（JDK9+ keytool 默认格式）的 keypass 恒等于 storepass，
              # 此时 ANDROID_KEY_PASSWORD 是个多余或过期的值，直接用 storepass 签，
              # 签名身份不变，不必重跑构建。
              echo "::notice::ANDROID_KEY_PASSWORD 恢复不了私钥，本次改用 ANDROID_KEYSTORE_PASSWORD 签名"
              {
                echo "### Android 签名口令来源已回退"
                echo ""
                echo "- \`ANDROID_KEY_PASSWORD\`（探针状态 ${first}）恢复不了私钥，"
                echo "  本次已自动改用 \`ANDROID_KEYSTORE_PASSWORD\`，产物仍为 release 签名包。"
                echo "- 建议把 \`ANDROID_KEY_PASSWORD\` 更新为与 \`ANDROID_KEYSTORE_PASSWORD\` 相同，消除该回退。"
              } >> "$GITHUB_STEP_SUMMARY"
              out true ANDROID_KEYSTORE_PASSWORD
              ;;
            UNOPENABLE)
              abort "ANDROID_KEYSTORE_PASSWORD 打不开 keystore：口令不正确或库已损坏（ANDROID_KEY_PASSWORD 探针状态：${first}）"
              ;;
            NOALIAS)
              abort "keystore 可打开，但库里没有 ANDROID_KEY_ALIAS 指定的别名条目（只报状态，不打印别名）"
              ;;
            UNRECOVERABLE)
              abort "ANDROID_KEY_PASSWORD 与 ANDROID_KEYSTORE_PASSWORD 都恢复不出该别名私钥"
              ;;
            *)
              abort "签名探针无法运行（需 JDK 11+ 的单文件源码模式），状态：${second}"
              ;;
          esac

      - name: Build release APK
        if: steps.sign.outputs.ready == 'true'
        working-directory: ui-android
        env:
          KS_PATH: ${{ github.workspace }}/.signing/lanchat.jks
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_PASS_FROM: ${{ steps.sign.outputs.key_pass_source }}
        run: |
          set -uo pipefail
          # 口令来源由预检确定，避免把错误口令交给 AGP 后在 packageRelease 才炸。
          if [ "$KEY_PASS_FROM" = "ANDROID_KEYSTORE_PASSWORD" ]; then
            SIGN_PASS="$KS_PASS"
          else
            SIGN_PASS="$KEY_PASS"
          fi
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KS_PATH" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGN_PASS"

      - name: Build debug APK (fallback)
        if: steps.sign.outputs.ready != 'true'
        working-directory: ui-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SIGNED: ${{ steps.sign.outputs.ready }}
        run: |
          set -uo pipefail
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            cp ui-android/app/build/outputs/apk/release/app-release.apk \
              "dist/LANChat-${TAG#v}-android-release.apk"
          else
            cp ui-android/app/build/outputs/apk/debug/app-debug.apk \
              "dist/LANChat-${TAG#v}-android-debug.apk"
          fi
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: Build macOS package (unsigned, universal daemon)
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ui-macos
        run: xcodegen generate --spec project.yml

      - name: Build app
        working-directory: ui-macos
        run: |
          xcodebuild -project LANChat.xcodeproj -scheme LANChat \
            -configuration Release -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO build

      - name: Build universal daemon
        run: |
          mkdir -p dist/daemon
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.commit=${GITHUB_SHA::7}" \
              -o "dist/daemon/lanchat-daemon-$arch" ./cmd/lanchat-daemon
          done
          lipo -create dist/daemon/lanchat-daemon-arm64 dist/daemon/lanchat-daemon-amd64 \
            -output dist/daemon/lanchat-daemon

      - name: Bundle daemon and zip
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          APP="ui-macos/build/DerivedData/Build/Products/Release/LANChat.app"
          mkdir -p "$APP/Contents/Resources"
          cp dist/daemon/lanchat-daemon "$APP/Contents/Resources/lanchat-daemon"
          chmod +x "$APP/Contents/Resources/lanchat-daemon"
          mkdir -p dist
          ditto -c -k --keepParent "$APP" \
            "dist/LANChat-${TAG#v}-macos-universal-unsigned.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/LANChat-*-macos-universal-unsigned.zip
          if-no-files-found: error

  ios:
    name: Build iOS Simulator package (unsigned)
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${{ env.GOMOBILE_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Add gomobile dependency
        run: go get golang.org/x/mobile@${{ env.GOMOBILE_VERSION }}

      - name: gomobile init
        run: gomobile init

      - name: Generate XCFramework
        run: |
          mkdir -p ui-ios/Frameworks
          gomobile bind -target=ios -iosversion=16.0 -prefix=LC \
            -o ui-ios/Frameworks/Mobile.xcframework ./bindings/mobile

      - name: Generate Xcode project
        working-directory: ui-ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ui-ios
        run: |
          # destination 已隐含架构，Xcode 16 下不得再显式指定 -arch，
          # 否则报错：destination implies architecture
          xcodebuild -project LANChat.xcodeproj -scheme LANChat \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Zip simulator app
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          mkdir -p dist
          ditto -c -k --keepParent \
            ui-ios/build/DerivedData/Build/Products/Release-iphonesimulator/LANChat.app \
            "dist/LANChat-${TAG#v}-ios-simulator-unsigned.zip"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: dist/LANChat-*-ios-simulator-unsigned.zip
          if-no-files-found: error

  windows-msi:
    name: Build Windows MSI + portable zip (unsigned)
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve versions
        id: ver
        shell: pwsh
        run: |
          $v = '${{ needs.resolve.outputs.tag }}'.TrimStart('v')
          $build = [int]$Env:GITHUB_RUN_NUMBER
          if ($build -gt 65534) { $build = $build % 65534 }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "msiVersion=$v.$build" >> $env:GITHUB_OUTPUT

      - name: Build daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/bin" | Out-Null
          go build -trimpath -ldflags "-s -w -X main.commit=$($env:GITHUB_SHA.Substring(0,7))" `
            -o "dist/bin/lanchat-daemon.exe" ./cmd/lanchat-daemon

      - name: Publish WinUI app (self-contained, unpackaged)
        shell: pwsh
        # WindowsPackageType=None => 无包标识的 unpackaged 应用。
        # 此时 LANChat.exe 直接 Process.Start 同目录的 lanchat-daemon.exe，
        # 不走 MSIX 的 FullTrustProcessLauncher / ApplicationData 路径。
        run: |
          dotnet publish ui-win/src/LANChat.App/LANChat.App.csproj `
            -c Release -p:Platform=x64 -r win-x64 `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -o dist/publish

      - name: Stage daemon next to the app
        shell: pwsh
        # publish 之后再拷入，避免依赖「publish 不会清理输出目录」这一隐式假设。
        # UI 用 AppContext.BaseDirectory 定位 daemon，二者必须同级。
        run: |
          Copy-Item dist/bin/lanchat-daemon.exe dist/publish/lanchat-daemon.exe -Force
          foreach ($f in 'LANChat.exe','lanchat-daemon.exe') {
            if (-not (Test-Path "dist/publish/$f")) { throw "dist/publish 缺少 $f" }
          }

      - name: Install WiX v4
        shell: pwsh
        run: dotnet tool install --global wix --version 4.0.5

      - name: Generate and build MSI
        shell: pwsh
        run: |
          scripts/new-msi.ps1 -SourceDir dist/publish -OutputWxs dist/lanchat.wxs `
            -Version '${{ steps.ver.outputs.msiVersion }}' `
            -UpgradeCode "7B3E9A24-1C5F-4D6B-9E8A-2F0C5D8A3B17"
          $v = '${{ steps.ver.outputs.version }}'
          wix build -arch x64 -nologo `
            -o "dist/LANChat-$v-windows-x64.msi" dist/lanchat.wxs

      - name: Build portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/publish/* `
            -DestinationPath "dist/LANChat-${{ steps.ver.outputs.version }}-windows-x64-portable.zip"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: |
            dist/LANChat-*-windows-x64.msi
            dist/LANChat-*-windows-x64-portable.zip
          if-no-files-found: error

  msix:
    name: Build MSIX (Store + Sideload)
    needs: resolve
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = '${{ needs.resolve.outputs.tag }}'.TrimStart('v')
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build daemon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/bin" | Out-Null
          go build -trimpath -ldflags "-s -w -X main.commit=$($env:GITHUB_SHA.Substring(0,7))" `
            -o "dist/bin/lanchat-daemon.exe" ./cmd/lanchat-daemon

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "未找到 MSBuild" }
          echo "path=$msbuild" >> $env:GITHUB_OUTPUT

      - name: Create self-signed code-signing certificate (Sideload)
        id: cert
        shell: pwsh
        run: |
          $pwd = ConvertTo-SecureString -String "lanchat" -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=B072FED8-68F4-4903-9942-BB0A460B36EF" `
            -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 `
            -CertStoreLocation "Cert:\CurrentUser\My"
          $pfx = Join-Path $env:GITHUB_WORKSPACE "dist\lanchat-sideload.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pwd | Out-Null
          $thumb = $cert.Thumbprint
          echo "thumb=$thumb" >> $env:GITHUB_OUTPUT
          Write-Host "Sideload cert thumbprint: $thumb"

      - name: Build Sideload MSIX (signed)
        shell: pwsh
        # 无托管下载地址，AppInstallerUri 必填但无法提供；
        # 关闭 .appinstaller 生成，否则 WinAppSdkGenerateAppInstallerFile 报 MSB4044。
        # 注意：说明性注释不能放在反引号续行中间，否则会打断 PowerShell 续行。
        run: |
          $daemon = Join-Path $env:GITHUB_WORKSPACE "dist/bin/lanchat-daemon.exe"
          $pfx = Join-Path $env:GITHUB_WORKSPACE "dist\lanchat-sideload.pfx"
          & "${{ steps.msbuild.outputs.path }}" src/LANChat.App/LANChat.App.csproj `
            /restore /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            /p:RestoreRuntimeIdentifier=win-x64 `
            /p:WindowsPackageType=MSIX /p:WindowsAppSDKSelfContained=true `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxBundle=Never /p:AppxBundlePlatforms=x64 `
            /p:GenerateAppInstallerFile=false `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$pfx" `
            /p:PackageCertificatePassword=lanchat `
            "/p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumb }}" `
            "/p:DaemonPath=$daemon" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\SideloadPackages\\"
        working-directory: ui-win

      - name: Build Store MSIX (unsigned for re-sign)
        shell: pwsh
        run: |
          $daemon = Join-Path $env:GITHUB_WORKSPACE "dist/bin/lanchat-daemon.exe"
          & "${{ steps.msbuild.outputs.path }}" src/LANChat.App/LANChat.App.csproj `
            /restore /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 /p:SelfContained=true `
            /p:RestoreRuntimeIdentifier=win-x64 `
            /p:WindowsPackageType=MSIX /p:WindowsAppSDKSelfContained=true `
            /p:AppxPackageSigningEnabled=false `
            /p:AppxPackageSigningKeyFile="" `
            /p:GenerateAppxPackageOnBuild=true `
            /p:UapAppxPackageBuildMode=StoreUpload `
            /p:AppxBundle=Never /p:AppxBundlePlatforms=x64 `
            /p:GenerateAppInstallerFile=false `
            "/p:DaemonPath=$daemon" `
            /p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\StorePackages\\"
        working-directory: ui-win

      - name: Collect packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/out" | Out-Null
          $v = '${{ steps.ver.outputs.version }}'
          # Store 上传包
          $store = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\StorePackages" -Recurse `
            -Include *.msixupload,*.msix | Where-Object { $_.FullName -notmatch '\\obj\\' } |
            Sort-Object Extension -Descending | Select-Object -First 1
          if (-not $store) { throw "未找到 Store 包" }
          Copy-Item $store.FullName "dist/out/LANChat-$v-windows-x64-Store$($store.Extension)"
          # Sideload 主包 + 安装证书 + appinstaller
          $side = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\SideloadPackages" -Recurse `
            -Include *.msix | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
          if (-not $side) { throw "未找到 Sideload 包" }
          Copy-Item $side.FullName "dist/out/LANChat-$v-windows-x64-Sideload.msix"
          $appinst = Get-ChildItem "$env:GITHUB_WORKSPACE\dist\SideloadPackages" -Recurse `
            -Include *.appinstaller | Where-Object { $_.FullName -notmatch '\\obj\\' } | Select-Object -First 1
          if ($appinst) { Copy-Item $appinst.FullName "dist/out/LANChat-$v-windows-x64.appinstaller" }
          Copy-Item "$env:GITHUB_WORKSPACE\dist\lanchat-sideload.pfx" "dist/out/lanchat-sideload-cert.pfx"
          Get-ChildItem dist/out

      - uses: actions/upload-artifact@v4
        with:
          name: msix-release
          path: dist/out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [resolve, daemon, linux, android, macos, ios, windows-msi, msix]
    if: needs.resolve.outputs.do_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p assets
          find release -type f -exec cp -n {} assets/ \;
          ls -lh assets

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          files: assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
