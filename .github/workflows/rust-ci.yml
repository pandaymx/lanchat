name: Linux UI CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ui-linux/**'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

jobs:
  rust:
    name: cargo fmt / clippy / test
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK4 / libadwaita / packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev dpkg-dev rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui-linux

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

      - name: Verify deb & rpm packaging
        working-directory: ${{ github.workspace }}
        run: |
          chmod +x scripts/package-linux.sh
          WORK="$(mktemp -d)"
          printf '#!/bin/sh\n' > "$WORK/lanchat-ui"
          printf '#!/bin/sh\n' > "$WORK/lanchat-daemon"
          chmod +x "$WORK/lanchat-ui" "$WORK/lanchat-daemon"
          VERSION="0.0.0-ci" UI_BIN="$WORK/lanchat-ui" DAEMON_BIN="$WORK/lanchat-daemon" OUT_DIR="$WORK/out" \
            ./scripts/package-linux.sh
          test -f "$WORK/out/LANChat-0.0.0-ci-linux-x64.tar.gz"
          test -f "$WORK/out/LANChat-0.0.0-ci-linux-amd64.deb"
          test -f "$WORK/out/LANChat-0.0.0-ci-linux-x86_64.rpm"
          dpkg-deb --info "$WORK/out/LANChat-0.0.0-ci-linux-amd64.deb"
          rpm -qip "$WORK/out/LANChat-0.0.0-ci-linux-x86_64.rpm"
