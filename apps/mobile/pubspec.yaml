name: lanchat_mobile
description: "lanchat 局域网即时通讯移动端（Flutter）——直连 hub 的 WS 协议客户端"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^2.4.0
  shared_preferences: ^2.2.0
  http: ^1.1.0
  intl: ^0.19.0
  image_picker: ^1.1.0
  record: ^6.2.1
  audioplayers: ^6.0.0
  flutter_local_notifications: ^22.3.0
  video_player: ^2.14.0
  package_info_plus: ^10.2.1
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon_512.png
