# LANChat 信令服务端示例配置。
# 复制为 lanchat.yaml 后按需修改；优先级：CLI flag > 环境变量 LANCHAT_* > 本文件 > 默认值。
server:
  listen: ":19090"
  path: "/lctp"
  authMode: "psk"
  # 用 `lanchat genpsk` 生成 bcrypt 哈希后粘贴到这里；切勿在配置中写明文口令。
  pskHash: "$2a$10$REPLACE_WITH_OUTPUT_OF_lanchat_genpsk"
  heartbeatSec: 5
  idleTimeoutSec: 15
  shutdownGraceSec: 10
