name: LANChat
options:
  bundleIdPrefix: dev.lanchat
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.9.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LANChat:
    type: application
    platform: iOS
    sources:
      - path: LANChat
        excludes:
          - "Info.plist"
          - "LANChat-Bridging-Header.h"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.lanchat.ios
        PRODUCT_NAME: LANChat
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: LANChat/LANChat-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/Frameworks"
    info:
      path: LANChat/Info.plist
      properties:
        CFBundleDisplayName: LANChat
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # 本地网络权限：mDNS 浏览与 P2P 直连
        NSLocalNetworkUsageDescription: 用于在局域网内发现中心节点、与其他设备直连传输文件。
        NSBonjourServices:
          - _lanchat._tcp
    dependencies:
      - framework: Frameworks/Mobile.xcframework
        embed: true
        codeSign: true
