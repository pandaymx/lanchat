[package]
name = "lanchat-ui"
version = "0.1.0"
edition = "2021"
description = "LANChat Linux 原生 UI（GTK4 + libadwaita）"

[[bin]]
name = "lanchat-ui"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_5", "v1_6"] }
glib = { package = "glib", version = "0.20" }
gio = { package = "gio", version = "0.20" }
gdk = { package = "gdk4", version = "0.9", features = ["v4_16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "macros", "sync", "time", "process"] }
anyhow = "1"
dirs = "5"
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
